name: Build AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Make App
        run: |
          echo "include ':app'" > settings.gradle
          mkdir -p app/src/main/java/com/hisab/khata
          
          # 1. BUILD.GRADLE
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply true
          }
          android {
              compileSdk 34
              namespace 'com.hisab.khata'
              defaultConfig {
                  applicationId "com.hisab.khata"
                  minSdk 21
                  targetSdk 34
                  versionCode 6
                  versionName "6.0"
              }
              signingConfigs {
                  release {
                      storeFile file('../hisab.jks')
                      storePassword 'hisab123'
                      keyAlias 'hisab'
                      keyPassword 'hisab123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-ads:22.5.0'
          }
          EOF
          
          # 2. MANIFEST - Yaha APP ID hai
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Hisab Khata">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5685258517627203~5338147612"/>
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 3. MAIN ACTIVITY - Yaha BANNER ID hai
          cat > app/src/main/java/com/hisab/khata/MainActivity.java << 'EOF'
          package com.hisab.khata;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import com.google.android.gms.ads.*;
          public class MainActivity extends Activity {
              WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  MobileAds.initialize(this, status -> {});
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  AdView adView = new AdView(this);
                  adView.setAdSize(AdSize.BANNER);
                  adView.setAdUnitId("ca-app-pub-5685258517627203/3563242960");
                  adView.loadAd(new AdRequest.Builder().build());
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://rahilreza18.github.io/hisab-com/");
                  layout.addView(adView);
                  layout.addView(webView, new LinearLayout.LayoutParams(-1, -1, 1f));
                  setContentView(layout);
              }
              @Override
              public void onBackPressed() {
                  if(webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
          
          # KEYSTORE BANAO
          keytool -genkey -v -keystore hisab.jks -alias hisab -keyalg RSA -keysize 2048 -validity 10000 -storepass hisab123 -keypass hisab123 -dname "CN=Hisab, O=Hisab, C=IN"

      - name: Build AAB
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Signed-AdMob-AAB
          path: app/build/outputs/bundle/release/*.aab
