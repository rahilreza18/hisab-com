name: Build AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6
      - uses: android-actions/setup-android@v3
      - name: Create Project
        run: |
          cat > settings.gradle << 'EOF'
          include ":app"
          EOF
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:7.4.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10' } }
          EOF
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          EOF
          mkdir -p app/src/main/java/com/hisabcom/app app/src/main/assets app/src/main/res/values
          cp index.html app/src/main/assets/ 2>/dev/null || echo "<h1>hisab.com</h1>" > app/src/main/assets/index.html
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">hisab.com</string></resources>
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android { namespace 'com.hisabcom.app'; compileSdk 33; defaultConfig { applicationId "com.hisabcom.app"; minSdk 21; targetSdk 33; versionCode 9; versionName "1.9" }; buildTypes { release { minifyEnabled false } } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.gms:play-services-ads:21.5.0' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="@string/app_name" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5685258517627203~5338147612"/></application><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="com.google.android.gms.permission.AD_ID"/></manifest>
          EOF
          cat > app/src/main/java/com/hisabcom/app/MainActivity.kt << 'EOF'
          package com.hisabcom.app
          import android.os.Bundle; import android.webkit.*; import android.widget.LinearLayout; import androidx.appcompat.app.AppCompatActivity; import com.google.android.gms.ads.*; import com.google.android.gms.ads.interstitial.*
          class MainActivity : AppCompatActivity() {
            private var mAd: InterstitialAd? = null
            override fun onCreate(s: Bundle?) {
              super.onCreate(s); MobileAds.initialize(this)
              val lay = LinearLayout(this); lay.orientation = LinearLayout.VERTICAL
              val wv = WebView(this); wv.settings.javaScriptEnabled = true; wv.settings.domStorageEnabled = true; wv.webViewClient = WebViewClient(); wv.addJavascriptInterface(JS(), "Android"); wv.loadUrl("file:///android_asset/index.html"); wv.layoutParams = LinearLayout.LayoutParams(-1,0,1f)
              val adV = AdView(this); adV.setAdSize(AdSize.BANNER); adV.adUnitId = "ca-app-pub-5685258517627203/3563242960"; adV.layoutParams = LinearLayout.LayoutParams(-1,-2)
              lay.addView(wv); lay.addView(adV); setContentView(lay); adV.loadAd(AdRequest.Builder().build()); loadInt()
            }
            inner class JS { @JavascriptInterface fun showAd() { runOnUiThread { mAd?.show(this@MainActivity); loadInt() } } @JavascriptInterface fun finishApp() { finish() } }
            fun loadInt() { InterstitialAd.load(this,"ca-app-pub-5685258517627203/5332559559",AdRequest.Builder().build(),object:InterstitialAdLoadCallback(){override fun onAdLoaded(a:InterstitialAd){mAd=a}override fun onAdFailedToLoad(e:LoadAdError){mAd=null}})}
          }
          EOF
      - name: Build
        run: |
          gradle wrapper --gradle-version 7.6
          ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hisab-aab-final
          path: app/build/outputs/bundle/release/*.aab
