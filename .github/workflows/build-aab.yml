name: Build AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Create Hisab App with AdMob
        run: |
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          
          mkdir -p app/src/main/java/com/hisab/khata
          
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace 'com.hisab.khata'
              defaultConfig {
                  applicationId "com.hisab.khata"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              signingConfigs {
                  release {
                      storeFile file('../hisab-release.keystore')
                      storePassword 'hisab123'
                      keyAlias 'hisab'
                      keyPassword 'hisab123'
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-ads:22.5.0'
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Hisab Khata" android:theme="@android:style/Theme.NoTitleBar">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5685258517627203~5338147612"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/hisab/khata/MainActivity.java << 'EOF'
          package com.hisab.khata;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import com.google.android.gms.ads.*;
          public class MainActivity extends Activity {
              private WebView webView;
              private InterstitialAd mInterstitialAd;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  MobileAds.initialize(this, new OnInitializationCompleteListener() {
                      @Override public void onInitializationComplete(InitializationStatus status) {}
                  });
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  AdView adView = new AdView(this);
                  adView.setAdSize(AdSize.BANNER);
                  adView.setAdUnitId("ca-app-pub-5685258517627203/3563242960");
                  AdRequest adRequest = new AdRequest.Builder().build();
                  adView.loadAd(adRequest);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://rahilreza18.github.io/hisab-com/");
                  layout.addView(adView);
                  layout.addView(webView, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT, 1f));
                  setContentView(layout);
                  InterstitialAd.load(this, "ca-app-pub-5685258517627203/5332559559", adRequest, new InterstitialAdLoadCallback() {
                      @Override public void onAdLoaded(InterstitialAd ad) { mInterstitialAd = ad; }
                  });
              }
              @Override public void onBackPressed() {
                  if(webView.canGoBack()) webView.goBack();
                  else {
                      if(mInterstitialAd != null) mInterstitialAd.show(this);
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Generate Keystore
        run: keytool -genkey -v -keystore hisab-release.keystore -alias hisab -keyalg RSA -keysize 2048 -validity 10000 -storepass hisab123 -keypass hisab123 -dname "CN=Hisab, OU=Hisab, O=Hisab, L=Delhi, S=Delhi, C=IN"

      - name: Build Signed AAB with AdMob
        run: |
          cd app
          chmod +x ../gradlew || gradle wrapper
          ./gradlew bundleRelease || gradle bundleRelease

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: hisab-signed-admob-aab
          path: app/build/outputs/bundle/release/*.aab
