name: Build AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build AAB
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html || echo "no index"
          mkdir -p app/src/main/java/com/hisabcom/app
          printf '%s\n' "package com.hisabcom.app" "import android.os.Bundle" "import android.webkit.*" "import android.widget.LinearLayout" "import android.view.ViewGroup" "import androidx.appcompat.app.AppCompatActivity" "import com.google.android.gms.ads.*" "import com.google.android.gms.ads.interstitial.*" "class MainActivity : AppCompatActivity() {" "private var mInterstitialAd: InterstitialAd? = null" "lateinit var webView: WebView" "lateinit var adView: AdView" "override fun onCreate(savedInstanceState: Bundle?) {" "super.onCreate(savedInstanceState)" "MobileAds.initialize(this)" "val layout = LinearLayout(this)" "layout.orientation = LinearLayout.VERTICAL" "webView = WebView(this)" "webView.settings.javaScriptEnabled = true" "webView.settings.domStorageEnabled = true" "webView.webViewClient = WebViewClient()" "webView.addJavascriptInterface(WebAppInterface(), \"Android\")" "webView.loadUrl(\"file:///android_asset/index.html\")" "webView.layoutParams = LinearLayout.LayoutParams(-1,0,1f)" "adView = AdView(this)" "adView.setAdSize(AdSize.BANNER)" "adView.adUnitId = \"ca-app-pub-5685258517627203/3563242960\"" "layout.addView(webView)" "layout.addView(adView)" "setContentView(layout)" "adView.loadAd(AdRequest.Builder().build())" "loadAd()" "}" "inner class WebAppInterface {" "@android.webkit.JavascriptInterface fun showAd() { runOnUiThread { mInterstitialAd?.show(this@MainActivity); loadAd() } }" "@android.webkit.JavascriptInterface fun finishApp() { finish() } }" "fun loadAd() { InterstitialAd.load(this,\"ca-app-pub-5685258517627203/5332559559\",AdRequest.Builder().build(),object:InterstitialAdLoadCallback(){override fun onAdLoaded(ad:InterstitialAd){mInterstitialAd=ad}override fun onAdFailedToLoad(p:LoadAdError){mInterstitialAd=null}})}" "}" > app/src/main/java/com/hisabcom/app/MainActivity.kt
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > app/build.gradle
          echo "android { namespace 'com.hisabcom.app'; compileSdk 34; defaultConfig { applicationId \"com.hisabcom.app\"; minSdk 21; targetSdk 34; versionCode 3; versionName \"1.2\" } buildTypes { release { minifyEnabled false } } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.gms:play-services-ads:22.5.0' }" >> app/build.gradle
          echo "include \":app\"" > settings.gradle
          echo "plugins { id \"com.android.application\" version \"8.2.0\" apply false; id \"org.jetbrains.kotlin.android\" version \"1.9.0\" apply false }" > build.gradle
          mkdir -p app/src/main
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="hisab.com" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5685258517627203~5338147612"/></application><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="com.google.android.gms.permission.AD_ID"/></manifest>' > app/src/main/AndroidManifest.xml
          gradle wrapper --gradle-version 8.2
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hisab-aab
          path: app/build/outputs/bundle/release/*.aab
