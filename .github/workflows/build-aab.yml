name: Build AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create Keystore First
        run: keytool -genkey -v -keystore hisab.jks -alias hisab -keyalg RSA -keysize 2048 -validity 10000 -storepass hisab123 -keypass hisab123 -dname "CN=Hisab, O=Hisab, C=IN"

      - name: Create Android Project
        run: |
          echo "include ':app'" > settings.gradle
          mkdir -p app/src/main/java/com/hisab/khata
          
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              compileSdk 33
              namespace 'com.hisab.khata'
              defaultConfig {
                  applicationId "com.hisab.khata"
                  minSdk 21
                  targetSdk 33
                  versionCode 7
                  versionName "7.0"
              }
              signingConfigs {
                  release {
                      storeFile file('../hisab.jks')
                      storePassword 'hisab123'
                      keyAlias 'hisab'
                      keyPassword 'hisab123'
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-ads:22.5.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Hisab Khata">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5685258517627203~5338147612"/>
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/hisab/khata/MainActivity.java << 'EOF'
          package com.hisab.khata;
          import android.app.Activity; import android.os.Bundle; import android.webkit.*; import android.widget.LinearLayout;
          import com.google.android.gms.ads.*;
          public class MainActivity extends Activity {
              WebView wv;
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  MobileAds.initialize(this, s->{});
                  LinearLayout l=new LinearLayout(this); l.setOrientation(1);
                  AdView ad=new AdView(this); ad.setAdSize(AdSize.BANNER); ad.setAdUnitId("ca-app-pub-5685258517627203/3563242960"); ad.loadAd(new AdRequest.Builder().build());
                  wv=new WebView(this); wv.getSettings().setJavaScriptEnabled(true); wv.setWebViewClient(new WebViewClient()); wv.loadUrl("https://rahilreza18.github.io/hisab-com/");
                  l.addView(ad); l.addView(wv, new LinearLayout.LayoutParams(-1,-1,1f)); setContentView(l);
              }
              public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); }
          }
          EOF

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Signed-AAB
          path: app/build/outputs/bundle/release/*.aab
